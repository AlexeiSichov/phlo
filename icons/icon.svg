<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="100%" stop-color="#FFE4E8"/>
    </linearGradient>
    <linearGradient id="circle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B8B"/>
      <stop offset="100%" stop-color="#FF385C"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF5A79" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  
  <!-- Outer glowing cycle ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFA4B6" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>
  
  <!-- Inner circular orb -->
  <circle cx="256" cy="256" r="120" fill="url(#circle-grad)" filter="url(#soft-shadow)"/>
  
  <!-- Flo droplet / lotus core -->
  <path d="M256 180 C280 220 310 250 310 280 C310 310 286 332 256 332 C226 332 202 310 202 280 C202 250 232 220 256 180 Z" fill="#FFFFFF" opacity="0.95"/>
</svg>
